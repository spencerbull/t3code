name: Desktop macOS Artifact Build

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: desktop-macos-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS ${{ matrix.arch }} artifact
    if: contains(github.event.pull_request.labels.*.name, 'preview:mac')
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v6
        with:
          ref: f593a7ab134ca9466e699bc3953f3dda9e787393
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Set preview configuration
        run: cp .env.example .env

      - name: Build unsigned macOS installer
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --build-version 0.0.33-omarchy.3 \
            --output-dir "release-${{ matrix.arch }}" \
            --verbose

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: t3code-pr8165-mac-${{ matrix.arch }}
          path: release-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 1
